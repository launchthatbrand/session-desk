<div class="page login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Session Desk</h1>
    <p>Sign in to your committee desk</p>
    <div class="demo-logins">
      @for (account of accounts; track account.email) {
        <button type="button" class="demo-btn" (click)="signInAs(account.email)">
          Sign in as {{ account.role }}
          <small>{{ account.name }}</small>
        </button>
      }
    </div>
    <label>Email
      <input type="email" formControlName="email" autocomplete="username" />
    </label>
    <label>Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button type="submit" class="btn wide">Sign in</button>
  </form>
</div>
