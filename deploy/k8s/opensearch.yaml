apiVersion: v1
kind: Service
metadata:
  name: session-desk-opensearch
  namespace: launchthat
  labels:
    app: session-desk-opensearch
spec:
  selector:
    app: session-desk-opensearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-desk-opensearch
  namespace: launchthat
  labels:
    app: session-desk-opensearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: session-desk-opensearch
  template:
    metadata:
      labels:
        app: session-desk-opensearch
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.1
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 1280Mi
