apiVersion: v1
kind: Service
metadata:
  name: session-desk-web
  namespace: launchthat
  labels:
    app: session-desk-web
spec:
  type: NodePort
  selector:
    app: session-desk-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30469
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-desk-web
  namespace: launchthat
  labels:
    app: session-desk-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session-desk-web
  template:
    metadata:
      labels:
        app: session-desk-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: session-desk-web
          image: ghcr.io/launchthatapp/session-desk-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
