apiVersion: v1
kind: Service
metadata:
  name: session-desk-api
  namespace: launchthat
  labels:
    app: session-desk-api
spec:
  selector:
    app: session-desk-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-desk-api
  namespace: launchthat
  labels:
    app: session-desk-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session-desk-api
  template:
    metadata:
      labels:
        app: session-desk-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: session-desk-api
          image: ghcr.io/launchthatapp/session-desk-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: session-desk-env
                  key: ConnectionStrings__Default
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: session-desk-env
                  key: Jwt__SigningKey
            - name: Seed__AdminEmail
              valueFrom:
                secretKeyRef:
                  name: session-desk-env
                  key: Seed__AdminEmail
            - name: Seed__AdminPassword
              valueFrom:
                secretKeyRef:
                  name: session-desk-env
                  key: Seed__AdminPassword
            - name: MiniMax__ApiKey
              valueFrom:
                secretKeyRef:
                  name: session-desk-env
                  key: MiniMax__ApiKey
            - name: Langfuse__BaseUrl
              valueFrom:
                secretKeyRef:
                  name: session-desk-env
                  key: Langfuse__BaseUrl
                  optional: true
            - name: Langfuse__PublicKey
              valueFrom:
                secretKeyRef:
                  name: session-desk-env
                  key: Langfuse__PublicKey
                  optional: true
            - name: Langfuse__SecretKey
              valueFrom:
                secretKeyRef:
                  name: session-desk-env
                  key: Langfuse__SecretKey
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
