apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: session-desk
  namespace: launchthat
  labels:
    app: session-desk
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: session-desk.apps.onpoint.host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: session-desk-web
                port:
                  number: 80
